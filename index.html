<!--
THESIS: an index that reads as a screen-printed reference poster — flat ink
panels with a deliberate color-registration offset that snaps true on
hover — not another glass-card dashboard grid.
OWN-WORLD: paper-white ground, black ink rules, Archivo Black masthead type,
IBM Plex Mono meta labels, one flat poster color per category, misregistered
hard-offset "shadow" as the signature depth device.
STORY: visitor scans the color-key legend, finds a category band, picks a
numbered panel — every panel is a print, not a card.
FIRST VIEWPORT: masthead band, color legend, first category band and its
panels legible before scroll.
FORM: quick-reference poster, chosen directly with the user in chat after
naming six candidate cheatsheet-object worlds (concept-seed round skipped —
disproportionate for a personal reference site; direction picked by
conversation instead of the dice).
DATA-DRIVEN: categories/sheets live in one JS array (bottom of file) so
adding a new cheatsheet later means one object, not new CSS — user stated
more sheets are coming.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, DESIGN.md, and every shipping raster carrying
its provenance.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheatsheets — Rajesh Neyyala</title>
<meta name="description" content="Engineering reference sheets: AWS, system design, concurrency, algorithms and microservices.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23f4efe4'/%3E%3Crect x='3' y='3' width='18' height='18' fill='none' stroke='%23141414' stroke-width='2'/%3E%3Cpath d='M7 9h10M7 13h10M7 17h6' stroke='%23141414' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe4;
    --paper-raised:#fbf8f1;
    --ink:#141414;
    --ink-soft:#4a463d;
    --rule:rgba(20,20,20,0.16);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(rgba(20,20,20,0.05) 0.6px, transparent 0.6px);
    background-size:6px 6px;
    color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--ink); color:var(--paper); }

  *:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  ::-webkit-scrollbar{ width:12px; height:12px; }
  ::-webkit-scrollbar-track{ background:var(--paper); }
  ::-webkit-scrollbar-thumb{ background:var(--ink); border:3px solid var(--paper); border-radius:0; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 60px; }

  /* ---------- masthead ---------- */
  .masthead{
    background:var(--ink);
    color:var(--paper);
    margin:0 -20px 0;
    padding:34px 20px 26px;
  }
  .masthead-inner{ max-width:1140px; margin:0 auto; }
  .masthead-kicker{
    display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:0.2em; color:rgba(244,239,228,0.6);
    margin-bottom:10px;
  }
  .masthead-kicker svg{ width:16px; height:16px; }
  h1{
    margin:0;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:clamp(2.6rem, 7vw, 5rem);
    line-height:0.92;
    letter-spacing:-0.01em;
  }
  .masthead-sub{
    margin:12px 0 0;
    font-size:13px;
    color:rgba(244,239,228,0.72);
    max-width:56ch;
    line-height:1.6;
  }

  /* legend */
  .legend{
    display:flex; flex-wrap:wrap; gap:10px 22px;
    list-style:none; margin:24px 0 0; padding:16px 0 0;
    border-top:1px solid rgba(244,239,228,0.25);
    font-size:11px; letter-spacing:0.06em;
  }
  .legend li{ display:flex; align-items:center; gap:8px; color:rgba(244,239,228,0.85); }
  .legend .swatch{ width:10px; height:10px; flex:none; }

  /* ---------- sections ---------- */
  section.category{ margin-top:38px; }
  .category-band{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:9px 16px;
    color:#fff;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:clamp(1rem, 2.4vw, 1.35rem);
    letter-spacing:0.01em;
  }
  .category-band .count{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.14em;
  }

  .entries{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px 18px;
    margin-top:20px;
  }

  .entry{
    position:relative;
    display:flex; flex-direction:column;
    min-height:220px;
    padding:18px;
    background:var(--paper-raised);
    border:2px solid var(--ink);
    color:inherit;
    text-decoration:none;
    box-shadow:5px 5px 0 var(--accent, var(--ink));
    transition:box-shadow 0.3s cubic-bezier(.16,1,.3,1), transform 0.3s cubic-bezier(.16,1,.3,1), background 0.3s ease;
  }
  .entry:hover, .entry:focus-visible{
    box-shadow:1px 1px 0 var(--accent, var(--ink));
    transform:translate(4px,4px);
    background:var(--accent-tint, var(--paper-raised));
  }

  .entry-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    font-size:10.5px; letter-spacing:0.12em; color:var(--ink-soft);
    margin-bottom:14px;
  }
  .entry-head .num{ color:var(--ink); font-weight:600; }

  .entry-icon{ width:30px; height:30px; color:var(--accent, var(--ink)); margin-bottom:12px; transition:transform 0.3s ease; }
  .entry:hover .entry-icon, .entry:focus-visible .entry-icon{ transform:scale(1.08) rotate(-2deg); }

  .entry h3{
    margin:0 0 8px;
    font-family:'Archivo Black', sans-serif;
    text-transform:uppercase;
    font-size:1.18rem;
    line-height:1.08;
    letter-spacing:0;
  }
  .entry p{ margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-soft); max-width:38ch; }

  .entry-foot{
    margin-top:auto; padding-top:14px;
    display:flex; justify-content:space-between;
    font-size:10px; letter-spacing:0.1em; color:var(--ink-soft);
  }
  .entry-foot .go{ font-weight:600; color:var(--ink); }

  footer{
    margin-top:52px; padding:20px 0 0;
    border-top:2px solid var(--ink);
    display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
    font-size:11px; letter-spacing:0.05em; color:var(--ink-soft);
  }
  footer a{ color:var(--ink); }

  @media (max-width:980px){
    .entries{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:640px){
    .entries{ grid-template-columns:1fr; }
    .masthead{ padding:26px 16px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-inner">
      <div class="masthead-kicker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
        RAJESHNEYYALA.DEV
      </div>
      <h1>Cheatsheet Index</h1>
      <p class="masthead-sub">A growing set of quick-reference sheets for interviews and day-to-day engineering. Color-coded by discipline — the key updates as sheets are added.</p>
      <ul class="legend" id="legend"></ul>
    </div>
  </div>

  <main id="sections"></main>

  <footer>
    <span>© <span id="year"></span> Rajesh Neyyala · compiled reference set</span>
    <span>cheatsheets.rajeshneyyala.dev</span>
  </footer>

</div>

<script>
// One object per sheet. Add a new entry here to add a new tile — no CSS edits needed.
// Category color assigns automatically from PALETTE, cycling if categories exceed it.
const ICONS = {
  cloud: '<path d="M7 17a4 4 0 0 1-.5-7.97A5 5 0 0 1 16 8.5 4.5 4.5 0 0 1 17.5 17H7z"/>',
  layers: '<rect x="4" y="4" width="16" height="4.5"/><rect x="4" y="10" width="16" height="4.5"/><rect x="4" y="16" width="16" height="4.5"/>',
  blocks: '<rect x="4" y="4" width="16" height="16"/><path d="M4 11h16M12 11v9"/>',
  threads: '<path d="M4 8c4 0 4 8 8 8s4-8 8-8"/><path d="M4 16c4 0 4-8 8-8s4 8 8 8"/>',
  tree: '<circle cx="12" cy="4.5" r="2"/><circle cx="6" cy="14" r="2"/><circle cx="18" cy="14" r="2"/><circle cx="12" cy="19.5" r="1.6"/><path d="M12 6.5 6 12M12 6.5l6 5.5M6 16l4.5 2M18 16l-4.5 2"/>',
  mesh: '<path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/>',
  container: '<rect x="4" y="7" width="16" height="12" rx="1"/><path d="M4 11h16M9 7V4h6v3"/>'
};

const PALETTE = [
  { bg:'#c8402a', tint:'rgba(200,64,42,0.12)',  ink:'#fff' },
  { bg:'#1e5bc6', tint:'rgba(30,91,198,0.10)',  ink:'#fff' },
  { bg:'#dba018', tint:'rgba(219,160,24,0.16)', ink:'#141414' },
  { bg:'#1f8f6f', tint:'rgba(31,143,111,0.12)', ink:'#fff' },
  { bg:'#7b4fe0', tint:'rgba(123,79,224,0.12)', ink:'#fff' },
  { bg:'#c23b7a', tint:'rgba(194,59,122,0.12)', ink:'#fff' },
];

const CATEGORIES = [
  { name:'Cloud', sheets:[
    { num:'01', title:'AWS for Java & AI Engineers', desc:'Core services, patterns and gotchas for Java and AI workloads on AWS.', href:'aws-cheatsheet.html', icon:'cloud' },
  ]},
  { name:'System Design', sheets:[
    { num:'02', title:'HLD Interview Cheat Sheet', desc:'High-level design primitives, trade-offs and interview patterns.', href:'HLD-Cheat-Sheet.html', icon:'layers' },
    { num:'03', title:'LLD Knowledge Base', desc:'Low-level design, OOP patterns and SDE2 backend fundamentals.', href:'lld-cheatsheet.html', icon:'blocks' },
  ]},
  { name:'Concurrency', sheets:[
    { num:'04', title:'Java Concurrency', desc:'Threads, locks, executors and the Java memory model, distilled.', href:'java-concurrency-cheatsheet.html', icon:'threads' },
  ]},
  { name:'Algorithms', sheets:[
    { num:'05', title:'DSA Pattern Map', desc:'Core data structure and algorithm patterns for interviews.', href:'dsa-cheatsheet.html', icon:'tree' },
  ]},
  { name:'Distributed Systems', sheets:[
    { num:'06', title:'Microservices Java Cheat Sheet', desc:'Service boundaries, resilience and Java microservice patterns.', href:'microservices-cheatsheet.html', icon:'mesh' },
  ]},
  { name:'Containers', sheets:[
    { num:'07', title:'Docker for Java & AI Engineers', desc:'Dockerfiles, JVM-in-container tuning, GPU access and Compose stacks.', href:'docker-cheatsheet.html', icon:'container' },
  ]},
];

const legend = document.getElementById('legend');
const sectionsRoot = document.getElementById('sections');

CATEGORIES.forEach((cat, i) => {
  const color = PALETTE[i % PALETTE.length];

  const li = document.createElement('li');
  li.innerHTML = `<span class="swatch" style="background:${color.bg}"></span>${cat.name}`;
  legend.appendChild(li);

  const section = document.createElement('section');
  section.className = 'category';
  section.innerHTML = `
    <div class="category-band" style="background:${color.bg}; color:${color.ink}">
      <span>${cat.name}</span>
      <span class="count">${String(cat.sheets.length).padStart(2,'0')} SHEET${cat.sheets.length > 1 ? 'S' : ''}</span>
    </div>
    <div class="entries"></div>
  `;
  const entriesRoot = section.querySelector('.entries');

  cat.sheets.forEach(s => {
    const a = document.createElement('a');
    a.className = 'entry';
    a.href = s.href;
    a.style.setProperty('--accent', color.bg);
    a.style.setProperty('--accent-tint', color.tint);
    a.innerHTML = `
      <div class="entry-head"><span class="num">No. ${s.num}</span><span>${cat.name.toUpperCase()}</span></div>
      <svg class="entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${ICONS[s.icon] || ''}</svg>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <div class="entry-foot"><span>HTML</span><span class="go">OPEN →</span></div>
    `;
    entriesRoot.appendChild(a);
  });

  sectionsRoot.appendChild(section);
});

document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
